<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Paragraph Writing Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
background-image:url("https://img.freepik.com/premium-photo/flat-school-supplies-isolated-bright-colors-various-educational-school_981650-9465.jpg");
background-size:cover;
background-position:center;
min-height:100vh;
color:#1e1b4b;
}

.header{
display:flex;
justify-content:center;
padding:35px;
}

.header-title{
font-family:'Playfair Display',serif;
font-size:38px;
padding:18px 70px;
border-radius:16px;
color:white;
background:linear-gradient(135deg,#7c3aed,#a855f7);
box-shadow:0 10px 40px rgba(120,60,200,.35);
}

.workspace{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
padding:20px;
}

.panel{
background:white;
border-radius:18px;
padding:28px;
box-shadow:0 15px 45px rgba(0,0,0,.08);
display:flex;
flex-direction:column;
gap:18px;
}

.panel h3{
font-size:22px;
text-align:center;
color:#6d28d9;
}

.level-buttons{
display:flex;
gap:10px;
}

.level-buttons button{
flex:1;
padding:10px;
border-radius:10px;
border:none;
font-weight:600;
cursor:pointer;
}

.easy{background:#22c55e;color:white;}
.medium{background:#eab308;color:white;}
.hard{background:#ef4444;color:white;}

.instruction-box{
background:#f5f3ff;
border-left:4px solid #7c3aed;
padding:12px;
border-radius:8px;
text-align:center;
}
.actions{
display:flex;
align-items:center;
gap:10px;
margin-top:15px;
}

/* PLAY BUTTON */

.playBtn{
background:#16a34a;
color:white;
font-size:16px;
font-weight:600;
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
box-shadow:0 4px 8px rgba(0,0,0,0.2);
transition:0.3s;
}

.playBtn:hover{
background:#15803d;
transform:scale(1.05);
}

/* SPEED DROPDOWN */

.speedSelect{
padding:6px 8px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
cursor:pointer;
}

/* OTHER BUTTONS */

.actions button:not(.playBtn){
background:#2563eb;
color:white;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

.actions button:not(.playBtn):hover{
background:#1e40af;
}

textarea{
width:100%;
height:160px;
padding:15px;
border-radius:12px;
border:2px solid #ddd6fe;
font-size:15px;
outline:none;
}

textarea:focus{
border-color:#7c3aed;
}

button{
padding:10px 16px;
border-radius:10px;
border:none;
background:#ede9fe;
color:#4c1d95;
cursor:pointer;
}

.primary{
background:linear-gradient(135deg,#7c3aed,#a855f7);
color:white;
font-weight:600;
}

.stats{
display:flex;
gap:15px;
}

.stats div{
flex:1;
background:#f5f3ff;
padding:15px;
border-radius:12px;
text-align:center;
}

.progress{
width:100%;
height:12px;
background:#ede9fe;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#7c3aed,#c084fc);
width:0%;
}

.word{
padding:5px 8px;
margin:3px;
border-radius:6px;
display:inline-block;
font-size:14px;
}

.correct{
background:#dcfce7;
color:#166534;
}

.wrong{
background:#fee2e2;
color:#991b1b;
}

/* POPUP */

.popup-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:flex;
justify-content:center;
align-items:center;
visibility:hidden;
opacity:0;
transition:.3s;
}

.popup-overlay.active{
visibility:visible;
opacity:1;
}

.popup-box{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
width:340px;
box-shadow:0 20px 60px rgba(0,0,0,0.3);
transform:scale(.8);
transition:.3s;
}

.popup-overlay.active .popup-box{
transform:scale(1);
}

</style>
</head>

<body>

<div class="header">
<div class="header-title">Paragraph Writing Lab</div>
</div>

<div class="workspace">

<div class="panel">

<h3 id="questionNo">Question</h3>

<div class="level-buttons">
<button class="easy" onclick="startLevel('easy')">Easy</button>
<button class="medium" onclick="startLevel('medium')">Medium</button>
<button class="hard" onclick="startLevel('hard')">Hard</button>
</div>

<div class="instruction-box">
🎧 Listen carefully and type the paragraph
</div>

<div class="actions">

<button class="playBtn" onclick="playAudio()">🔊 Play Audio</button>

<select id="speedSelect" class="speedSelect">
<option value="0.6">Slow</option>
<option value="0.9" selected>Medium</option>
<option value="1.2">Fast</option>
</select>

<!-- <button onclick="checkTyping()">Submit</button> -->
<!-- <button onclick="showHint()">💡 Hint</button> -->

</div>

<textarea id="input" placeholder="Listen and type the paragraph..."></textarea>

<button class="primary" onclick="checkTyping()">Submit Response</button>

</div>

<div class="panel">

<h3>Student Score</h3>

<div class="stats">
<div>Score: <span id="score">0</span></div>
<div>Speed: <span id="speed">0</span> WPM</div>
</div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

<button onclick="downloadReport()">Export Excel Report</button>

<div id="feedback"></div>
<div id="answer"></div>

</div>

</div>

<div id="popup" class="popup-overlay">
<div class="popup-box">
<h2 id="popupTitle">Welcome</h2>
<p id="popupText"></p>
<br>
<button onclick="closePopup()">Continue</button>
</div>
</div>

<script type="module">

import { paragraphs } from "./static/paragraphs.js";

/* ---------------- GET GRADE ---------------- */

const params = new URLSearchParams(window.location.search);

let currentGrade = params.get("grade") || localStorage.getItem("selectedGrade");

if(!currentGrade){
alert("Please select a grade first.");
window.location.href = "index.html";
}

localStorage.setItem("selectedGrade", currentGrade);

/* ---------------- VARIABLES ---------------- */

let questions = [];
let currentQuestion = 0;
let score = 0;
let attempts = 0;
let audioPlayed = false;
let startTime = 0;
let learningStage = false;
let currentLevel = null;
let firstStart = true;
let reportData = [];

let levelOrder = ["easy","medium","hard"];
let currentLevelIndex = 0;

let indianVoice = null;

/* ---------------- LOAD VOICES ---------------- */

function loadVoices(){

const voices = speechSynthesis.getVoices();

indianVoice = voices.find(v =>
v.lang === "en-IN" &&
(v.name.toLowerCase().includes("female") ||
v.name.toLowerCase().includes("swara") ||
v.name.toLowerCase().includes("heera"))
);

if(!indianVoice){
indianVoice = voices.find(v => v.lang === "en-IN");
}

}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

/* ---------------- POPUP ---------------- */

function showPopup(title,message){

document.getElementById("popupTitle").innerText = title;
document.getElementById("popupText").innerText = message;

document.getElementById("popup").classList.add("active");

const speech = new SpeechSynthesisUtterance(message);

if(indianVoice){
speech.voice = indianVoice;
}

speech.rate = 0.9;
speech.pitch = 1.3;
speech.volume = 1;

speechSynthesis.cancel();
speechSynthesis.speak(speech);

}

function closePopup(){
document.getElementById("popup").classList.remove("active");
}

/* ---------------- START LEVEL ---------------- */

function startLevel(level){

questions = [...paragraphs[currentGrade][level]];
currentLevel = level;
currentLevelIndex = levelOrder.indexOf(level);

currentQuestion = 0;
score = 0;
attempts = 0;
learningStage = false;
audioPlayed = false;

document.getElementById("score").innerText = score;
document.getElementById("progressBar").style.width = "0%";

if(firstStart){

showPopup(
"Welcome",
"Welcome to the Paragraph Writing Module. Listen carefully and type the paragraph."
);

firstStart = false;

}

loadQuestion();

}

/* ---------------- LOAD QUESTION ---------------- */

function loadQuestion(){

attempts = 0;
learningStage = false;
audioPlayed = false;

startTime = Date.now();

document.getElementById("input").value = "";
document.getElementById("feedback").innerHTML = "";
document.getElementById("answer").innerText = "";

document.getElementById("questionNo").innerText =
`Question ${currentQuestion+1} / ${questions.length}`;

}

/* ---------------- PLAY AUDIO ---------------- */

function playAudio(){

if(!currentLevel){
showPopup("Select Level","Please select a level first.");
return;
}

document.getElementById("answer").innerText = "";

const text = questions[currentQuestion];

const speech = new SpeechSynthesisUtterance(text);

const speed = document.getElementById("speedSelect").value;
speech.rate = parseFloat(speed);

if(indianVoice){
speech.voice = indianVoice;
}

speechSynthesis.cancel();
speechSynthesis.speak(speech);

audioPlayed = true;

}

/* ---------------- INPUT EVENTS ---------------- */

const inputBox = document.getElementById("input");

inputBox.addEventListener("input",function(){

document.getElementById("answer").innerText = "";
liveCheck();

});

inputBox.addEventListener("copy",e=>e.preventDefault());
inputBox.addEventListener("cut",e=>e.preventDefault());

/* ---------------- LIVE CHECK ---------------- */

function liveCheck(){

if(!questions[currentQuestion]) return;

const paragraph = questions[currentQuestion];
const words = paragraph.split(" ");

const input = document.getElementById("input").value.trim();

reportData.push({
question: currentQuestion + 1,
correctSentence: paragraph,
studentAnswer: input,
date: new Date().toLocaleString()
});

const inputWords = input.split(" ");

let html = "";

for(let i=0;i<inputWords.length;i++){

if(inputWords[i] === words[i])
html += `<span class="word correct">${inputWords[i]}</span>`;
else
html += `<span class="word wrong">${inputWords[i]}</span>`;

}

document.getElementById("feedback").innerHTML = html;

}

/* ---------------- GRAMMAR CHECK ---------------- */

function grammarCheck(input,correct){

let errors=[];

if(!input) return errors;

if(input[0] !== input[0].toUpperCase()){
errors.push("First letter should be capital.");
}

if(!input.endsWith(".")){
errors.push("Missing full stop.");
}

const correctWords = correct.split(" ");
const inputWords = input.split(" ");

for(let i=0;i<inputWords.length;i++){

if(inputWords[i] && inputWords[i] !== correctWords[i]){
errors.push(`Spelling mistake: ${inputWords[i]}`);
break;
}

}

return errors;

}

/* ---------------- CHECK TYPING ---------------- */

function checkTyping(){

if(!audioPlayed){
showPopup("Audio Required","Please play the audio before submitting.");
return;
}

const paragraph = questions[currentQuestion];
const words = paragraph.split(" ");

const input = document.getElementById("input").value.trim();
const inputWords = input.split(" ");

let correctCount = 0;

for(let i=0;i<words.length;i++){
if(inputWords[i] === words[i]) correctCount++;
}

const accuracy = (correctCount / words.length) * 100;


/* typing speed */

const seconds = (Date.now() - startTime) / 1000;
const wpm = Math.round((inputWords.length / seconds) * 60);
document.getElementById("speed").innerText = wpm;


/* ---------- NORMAL STAGE ---------- */

if(!learningStage){

if(accuracy >= 50){

score++;
document.getElementById("score").innerText = score;

updateProgress();

if(currentQuestion < questions.length - 1){

showPopup(
"Correct",
"Good job. Moving to the next question."
);

setTimeout(()=>{
closePopup();
nextQuestion();
},1500);

}else{

setTimeout(()=>{
nextQuestion();
},500);

}

}else{

attempts++;

if(attempts < 3){

showPopup(
"Try Again",
`Accuracy below 50%. Attempts left: ${3-attempts}`
);

}else{

document.getElementById("answer").innerText =
"Correct Answer: " + paragraph;

learningStage = true;
attempts = 0;

showPopup(
"Learn the Sentence",
"Read the correct sentence carefully and type it exactly."
);

}

}

}

/* ---------- LEARNING STAGE ---------- */

else{

const correctAnswer = paragraph.trim().toLowerCase();

if(input.toLowerCase() === correctAnswer){

showPopup("Excellent","Correct sentence typed.");

score++;
document.getElementById("score").innerText = score;

updateProgress();

setTimeout(()=>{
closePopup();
nextQuestion();
},1500);

}else{

attempts++;

if(attempts < 3){

showPopup(
"Try Again",
`Type the correct sentence. Attempts left: ${3-attempts}`
);

}else{

document.getElementById("answer").innerText =
"Correct Answer: " + paragraph;

attempts = 0;

showPopup(
"Read Again",
"Please read the sentence again and type it carefully."
);

}

}

}

}

/* ---------------- PROGRESS ---------------- */

function updateProgress(){

const percent = ((currentQuestion+1)/questions.length)*100;
document.getElementById("progressBar").style.width = percent + "%";

}

/* ---------------- NEXT QUESTION ---------------- */

function nextQuestion(){

currentQuestion++;

if(currentQuestion >= questions.length){

if(currentLevelIndex < levelOrder.length-1){

showPopup(
"Level Completed",
`${currentLevel} level completed. Next level starting...`
);

setTimeout(()=>{
closePopup();
startLevel(levelOrder[currentLevelIndex+1]);
},2000);

}


else{

showPopup(
"All Levels Completed",
"Congratulations! All levels completed. Starting again."
);

setTimeout(()=>{
closePopup();
startLevel("easy");
},3000);

}

return;

}

loadQuestion();

}

/* ---------------- EXPORT REPORT ---------------- */

function downloadReport(){

const data = [
["Language Lab Report"],
[],
["Question","Correct Sentence","Student Answer","Date"]
];

reportData.forEach(item=>{
data.push([
item.question,
item.correctSentence,
item.studentAnswer,
item.date
]);
});

data.push([]);
// data.push(["Total Score",score]);
// data.push(["Total Questions",questions.length]);
data.push(["Report Date",new Date().toLocaleDateString()]);

const ws = XLSX.utils.aoa_to_sheet(data);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"Report");

XLSX.writeFile(wb,"language_lab_report.xlsx");

}
async function checkGrammarOnline(text){

const response = await fetch("https://api.languagetool.org/v2/check",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:`text=${encodeURIComponent(text)}&language=en-US`
});

const data = await response.json();

return data.matches;

}
/* ---------------- GLOBAL ---------------- */

window.startLevel = startLevel;
window.playAudio = playAudio;
window.checkTyping = checkTyping;
window.closePopup = closePopup;
window.downloadReport = downloadReport;

</script>
